name: Auto Assign Issues

on:
  issues:
    types: [opened]

# Assigning an issue needs issues: write. Without this block the job inherits
# the repository default, which is read-only, and the action fails with
# "Resource not accessible by integration".
permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto assign issue
        uses: pozil/auto-assign-issue@v1
        with:
          assignees: omaraelhawary

